<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>PilotHub by ChatPilot</title>
    <meta name="description" content="PilotHub — AI-powered business advisory platform for Myanmar founders and operators. BizPilot & FounderPilot." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#22c58b" />
    <meta name="background-color" content="#0a1628" />

    <!-- Apple PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PilotHub" />
    <link rel="apple-touch-icon" href="/manus-storage/pilothub-logo_5dd5446d.png" />

    <!-- Microsoft PWA meta tags -->
    <meta name="msapplication-TileColor" content="#0a1628" />
    <meta name="msapplication-TileImage" content="/manus-storage/pilothub-logo_5dd5446d.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/manus-storage/pilothub-logo_5dd5446d.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="PilotHub by ChatPilot" />
    <meta property="og:description" content="AI-powered business advisory platform for Myanmar founders and operators." />
    <meta property="og:image" content="/manus-storage/pilothub-logo_5dd5446d.png" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('[PWA] Service Worker registered:', registration.scope);
            })
            .catch(function(err) {
              console.log('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>

    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
